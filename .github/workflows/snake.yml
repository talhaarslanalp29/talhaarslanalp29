# Katkı yılanı — SADECE elle tetiklenir (otomatik çalışmaz, e-posta spam'i yapmaz).
# Çalıştırmadan önce: Settings > Actions > General > Workflow permissions >
#   "Read and write permissions" seçili olmalı. Sonra Actions sekmesinden "Run workflow".
name: Generate Snake Animation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=1fb8a6&color_dots=0a0a1a,0d1b4b,3a2a7a,7c3aed,1fb8a6

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
