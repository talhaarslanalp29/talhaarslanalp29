# Bu dosyayı profil reponda şu yola koy:  .github/workflows/snake.yml
# (repo:  github.com/talhaarslanalp29/talhaarslanalp29)
# Kaydettikten sonra Actions sekmesinden bir kez elle çalıştır ("Run workflow").
# Ürettiği SVG "output" dalına yazılır; README'deki yorumlu snake bloğunu açman yeter.

name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # her gün 00:00 UTC
  workflow_dispatch:       # elle tetikleme
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=00ffe7&color_dots=0a0a1a,0d1b4b,3a2a7a,7c3aed,00ffe7

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
